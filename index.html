<!-- 隱藏的 YouTube 播放器容器 -->
<div id="youtube-player" aria-hidden="true"></div>

<!-- 右下角音樂控制按鈕 -->
<button id="music-btn" class="music-toggle" type="button" aria-label="開啟音樂" aria-pressed="false">🔇 開啟音樂</button>

<!-- 載入 YouTube 官方 API 與控制腳本 -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const VIDEO_ID = "8jfac2hDiQY";

  let player;
  let isPlaying = false;
  const btn = document.getElementById("music-btn");

  function onYouTubeIframeAPIReady() {
    player = new YT.Player("youtube-player", {
      height: "1",
      width: "1",
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 0,
        loop: 1,
        playlist: VIDEO_ID,
        controls: 0,
        modestbranding: 1,
        rel: 0
      },
      events: {
        onReady: (event) => {
          event.target.setVolume(50);
        },
        onStateChange: (event) => {
          updateButton(event.data === YT.PlayerState.PLAYING);
        }
      }
    });
  }

  function updateButton(playing) {
    isPlaying = playing;
    btn.textContent = playing ? "🔊 播放中" : "🔇 開啟音樂";
    btn.setAttribute("aria-pressed", String(playing));
    btn.setAttribute("aria-label", playing ? "暫停音樂" : "開啟音樂");
  }

  function toggleMusic() {
    if (!player || typeof player.playVideo !== "function") return;

    if (isPlaying) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  }

  btn.addEventListener("click", toggleMusic);
</script>


<!-- 初音桌寵圖片（預設顯示站立圖） -->
<img id="miku-pet" src="miku-stand.png.png" alt="初音桌寵" class="miku-pet">

<script>
  const miku = document.getElementById("miku-pet");

  // 圖片清單
  const walkFrames = ["miku-walk1.png.png", "miku-stand.png.png", "miku-walk2.png.png", "miku-stand.png.png"];
  const panicFrames = ["miku-panic1.png.png", "miku-panic2.png.png", "miku-ouch.png.png"];

  let posX = window.innerWidth - 120; // 從畫面右側出發
  let direction = -1;                 // -1 代表向左走（符合原圖朝向），1 代表向右走
  const speed = 1.3;                  // 走路速度
  let frameIndex = 0;
  let isPanicking = false;            // 是否正在被戳/慌張狀態

  // 1. 雙腳踏步換圖動畫（每 220 毫秒換一張動作圖）
  setInterval(() => {
    if (isPanicking) {
      // 慌張狀態：輪播流冷汗與 >< 表情
      frameIndex = (frameIndex + 1) % panicFrames.length;
      miku.src = panicFrames[frameIndex];
    } else {
      // 正常散步：輪播走路與站立圖
      frameIndex = (frameIndex + 1) % walkFrames.length;
      miku.src = walkFrames[frameIndex];
    }
  }, 220);

  // 2. 左右移動與邊界轉向邏輯
  function moveMiku() {
    if (!isPanicking) {
      posX += speed * direction;

      // 走到最左邊時，轉頭向右走
      if (posX <= 10) {
        direction = 1;
        miku.style.transform = "scaleX(-1)"; // 水平翻轉面朝右
      } 
      // 走到最右邊時，轉頭向左走
      else if (posX >= window.innerWidth - 95) {
        direction = -1;
        miku.style.transform = "scaleX(1)";  // 恢復原圖面朝左
      }

      miku.style.left = posX + "px";
    }
    requestAnimationFrame(moveMiku);
  }

  // 啟動移動
  moveMiku();

  // 3. 點擊互動：戳一下初音，她會嚇一跳原地慌張掙扎 1.2 秒
  miku.addEventListener("click", (e) => {
    e.stopPropagation(); // 避免誤觸背景音樂開關
    if (isPanicking) return;

    isPanicking = true;
    frameIndex = 0;
    miku.src = "miku-ouch.png.png";
    miku.classList.add("miku-shake");

    setTimeout(() => {
      isPanicking = false;
      miku.classList.remove("miku-shake");
    }, 1200);
  });
</script>
